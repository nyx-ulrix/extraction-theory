<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#131312" />
    <meta name="description" content="Brew log and calibration history for espresso, filter, ice brew, cold brew, moka pot and Aeropress." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Extraction Theory</title>
    <script src="/theme.js"></script>
    <style>
      html, body { margin: 0; background: #ffffff; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #131312; }
      .boot { min-height: 100dvh; display: grid; place-items: center; }
      .boot img { width: 96px; height: 96px; }
      html[data-theme="dark"] .boot img { filter: invert(1); }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/logo.png" alt="Extraction Theory" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
